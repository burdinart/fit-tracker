# Деплой FitTracker на GitHub Pages: сборка Vite → публикация dist/
name: Deploy to GitHub Pages

on:
  # Публикуем при пуше в main
  push:
    branches: [main]
  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

# Права для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (tsc + vite build)
        run: npm run build

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

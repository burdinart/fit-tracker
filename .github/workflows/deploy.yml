# Деплой FitTracker на GitHub Pages: сборка Vite → публикация dist/
name: Deploy to GitHub Pages

on:
  # Публикуем при пуше в main
  push:
    branches: [main]
  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

# Права для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (tsc + vite build)
        # Секреты Supabase прокидываются как VITE_-переменные (иначе прод-сборка
        # соберётся с placeholder-значениями). Значения по умолчанию не секретные —
        # anon-ключ публичный и всё равно попадает в бандл.
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bacivvohmpeqkydjzvcy.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhY2l2dm9obXBlcWt5ZGp6dmN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzQzMzYsImV4cCI6MjEwNzY1MDMzNn0.NNMuT3gv2EvQYZdrCW6zLMTKZ_hWdyMmaCLZ96Jq4f0' }}
        run: npm run build

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

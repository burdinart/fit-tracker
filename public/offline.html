<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>FitTracker — офлайн</title>
    <!-- Инлайн-стили: страница должна корректно выглядеть без внешних ресурсов -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { text-align: center; padding: 2rem; max-width: 420px; }
      .icon { width: 96px; height: 96px; margin-bottom: 1rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #94a3b8; margin: 0 0 1.5rem; line-height: 1.5; }
      a {
        display: inline-block; background: #059669; color: #fff; text-decoration: none;
        padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="icon" viewBox="0 0 512 512" aria-hidden="true">
        <g fill="#38bdf8">
          <rect x="150" y="240" width="212" height="32" rx="16"/>
          <rect x="96" y="196" width="44" height="120" rx="14"/>
          <rect x="56" y="220" width="32" height="72" rx="12"/>
          <rect x="372" y="196" width="44" height="120" rx="14"/>
          <rect x="424" y="220" width="32" height="72" rx="12"/>
        </g>
      </svg>
      <h1>Нет подключения</h1>
      <p>
        FitTracker работает офлайн: интерфейс и последние сохранённые данные доступны.
        Проверьте соединение и обновите страницу.
      </p>
      <a href="./">Повторить</a>
    </main>
  </body>
</html>
